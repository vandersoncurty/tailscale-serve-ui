name: tailscale-serve-ui
services:
  tailscale-serve-ui:
    image: tailscale-serve-ui:latest
    build:
      context: .
    container_name: tailscale-serve-ui
    environment:
      HOST: "0.0.0.0"
      PORT: "8009"
      UI_USER: ""
      UI_PASSWORD: ""
      TAILSCALE_BIN: "/usr/local/bin/tailscale"
      SERVE_HTTPS_PORT: "443"
      TARGET_HOST: "127.0.0.1"
      PYTHONUNBUFFERED: "1"
    ports:
      - target: 8009
        published: "8009"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /var/run/tailscale
        target: /var/run/tailscale
      - type: bind
        source: /usr/bin/tailscale
        target: /usr/local/bin/tailscale
        read_only: true
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/tailscale.png
    x-casaos:
      ports:
        - container: "8009"
          description:
            en_US: Web UI port
            pt_BR: Porta da interface web
networks:
  default:
    name: tailscale-serve-ui_default
x-casaos:
  architectures:
    - amd64
    - arm64
  author: Tailscale Serve UI contributors
  category: Network
  description:
    en_US: Lightweight web interface to configure Tailscale Serve services.
    pt_BR: Interface web leve para configurar serviços do Tailscale Serve.
  developer: Tailscale Serve UI contributors
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/tailscale.png
  id: io.github.tailscale-serve-ui
  index: /
  is_uncontrolled: false
  main: tailscale-serve-ui
  port_map: "8009"
  scheme: http
  tagline:
    en_US: Manage Tailscale Serve from your browser
    pt_BR: Gerencie o Tailscale Serve pelo navegador
  title:
    custom: ""
    en_US: Tailscale Serve UI
    pt_BR: Tailscale Serve UI
